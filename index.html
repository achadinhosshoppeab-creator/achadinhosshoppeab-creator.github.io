<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achadinhos Shopee: promoções, cupons e ofertas do dia</title>
<meta name="description" content="Promoções e achadinhos da Shopee atualizados a cada 10 minutos: centenas de ofertas com desconto de verdade em casa, cozinha, beleza, moda, eletrônicos e pet. Receba primeiro no canal do Telegram.">
<link rel="canonical" href="https://achadinhosshoppeab-creator.github.io/">
<meta name="robots" content="index,follow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta property="og:title" content="Achadinhos Shopee: promoções e ofertas do dia">
<meta property="og:description" content="Centenas de ofertas da Shopee com desconto de verdade, atualizadas a cada 10 minutos.">
<meta property="og:image" content="https://achadinhosshoppeab-creator.github.io/logo.png">
<style>
  :root {
    --bg: #fff6f2; --card: #ffffff; --text: #1f1f1f; --muted: #6b6b6b;
    --brand: #ee4d2d; --brand-dark: #c93c20; --line: #f1d9d0; --chip: #ffe9e2; --star: #f5a524;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161210; --card: #221b18; --text: #f3ece8; --muted: #b3a79f; --line: #3a2d27; --chip: #3a2520; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  a { color: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { max-width: 960px; margin: 0 auto; padding: 12px 16px 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 800; font-size: 20px; color: var(--brand); }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .search { flex: 1 1 180px; display: flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; gap: 8px; }
  .search input { flex: 1; border: 0; background: transparent; color: inherit; font: inherit; outline: none; min-width: 0; }
  .search input::placeholder { color: var(--muted); }
  select { background: var(--card); color: inherit; border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; font: inherit; font-size: 14px; max-width: 100%; }
  .tg { display: inline-flex; align-items: center; gap: 6px; background: #2aabee; color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; padding: 7px 12px; border-radius: 999px; white-space: nowrap; }
  .chips { max-width: 960px; margin: 0 auto; display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; background: var(--chip); color: var(--brand); border: 1px solid transparent; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .chip.on { background: var(--brand); color: #fff; }
  main { max-width: 960px; margin: 0 auto; padding: 12px 16px 40px; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin: 0 0 12px; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 800px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; position: relative; transition: transform .12s; }
  .card:hover { transform: translateY(-2px); }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #fff; display: block; }
  .badge { position: absolute; top: 8px; left: 8px; background: var(--brand); color: #fff; font-weight: 800; font-size: 13px; padding: 4px 8px; border-radius: 999px; }
  .mall { position: absolute; top: 8px; right: 8px; background: #1f1f1f; color: #fff; font-weight: 700; font-size: 11px; padding: 3px 7px; border-radius: 999px; }
  .body { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .cat { color: var(--brand); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; min-height: 1.2em; }
  .title { font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
  .proof { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; min-height: 1.2em; }
  .proof .star { color: var(--star); }
  .old { color: var(--muted); font-size: 12px; text-decoration: line-through; min-height: 1.2em; }
  .price { color: var(--brand); font-weight: 800; font-size: 17px; }
  .price small { font-weight: 600; font-size: 11px; color: var(--muted); }
  .btn { margin-top: auto; background: var(--brand); color: #fff; text-align: center; border-radius: 10px; padding: 8px; font-weight: 700; font-size: 13px; }
  .card:active .btn { background: var(--brand-dark); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .pager { display: flex; justify-content: center; align-items: center; gap: 6px; margin: 20px 0 0; flex-wrap: wrap; }
  .pager button { background: var(--card); color: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font: inherit; font-weight: 700; cursor: pointer; min-width: 40px; }
  .pager button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .cta { margin-top: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; text-align: center; }
  .cta p { margin: 0 0 10px; }
  footer { max-width: 960px; margin: 0 auto; padding: 16px; color: var(--muted); font-size: 12px; text-align: center; border-top: 1px solid var(--line); }
  .hot { margin: 0 0 16px; }
  .hot h2 { margin: 0 0 8px; font-size: 16px; display: flex; align-items: center; gap: 6px; }
  .hot .row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .hot .row::-webkit-scrollbar { display: none; }
  .hot .card { flex: 0 0 150px; scroll-snap-align: start; border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  @media (min-width: 560px) { .hot .card { flex-basis: 170px; } }
  .hot .fire { position: absolute; top: 8px; right: 8px; font-size: 18px; }
  .skeleton .card { min-height: 280px; background: linear-gradient(90deg, var(--card) 25%, var(--chip) 50%, var(--card) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="./"><img src="icon-512.png" alt="">Achadinhos</a>
    <label class="search">🔍<input id="q" type="search" placeholder="Buscar produto..." autocomplete="off"></label>
    <select id="price" aria-label="Faixa de preço">
      <option value="0-">Qualquer preço</option>
      <option value="0-30">Até R$ 30</option>
      <option value="30-60">R$ 30 a 60</option>
      <option value="60-100">R$ 60 a 100</option>
      <option value="100-">Acima de R$ 100</option>
    </select>
    <select id="sort" aria-label="Ordenar">
      <option value="discount">Maior desconto</option>
      <option value="price">Menor preço</option>
      <option value="sales">Mais vendidos</option>
      <option value="rating">Melhor avaliados</option>
    </select>
    <a class="tg" href="https://t.me/achadinhos_divulga" target="_blank" rel="noopener">✈️ Telegram</a>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <section class="hot" id="hot" hidden>
    <h2>🔥 Pegando fogo</h2>
    <div class="row" id="hotrow"></div>
  </section>
  <div class="meta"><span id="count"></span><span id="updated"></span></div>
  <div class="grid skeleton" id="grid"><a class="card"></a><a class="card"></a><a class="card"></a><a class="card"></a></div>
  <p class="empty" id="empty" hidden>Nenhuma oferta encontrada.</p>
  <nav class="pager" id="pager" aria-label="Páginas"></nav>
  <div class="cta">
    <p><strong>Quer receber os achadinhos antes de todo mundo?</strong></p>
    <a class="tg" href="https://t.me/achadinhos_divulga" target="_blank" rel="noopener">✈️ Entrar no canal do Telegram</a>
  </div>
</main>
<footer>
  <p>Preços e estoque são definidos pela loja e podem mudar a qualquer momento.</p>
  <p><a href="privacidade.html">Política de privacidade</a> · <a href="termos.html">Termos de uso</a> · <a href="links.html">Links</a></p>
</footer>
<script>
  const PER_PAGE = 24;
  const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  const fmtSales = (n) => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(".", ",") + " mil" : String(n);
  const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const $ = (id) => document.getElementById(id);
  let all = [], page = 1, cat = "";

  function filtered() {
    const q = norm($("q").value.trim());
    const [min, max] = $("price").value.split("-").map((v) => v === "" ? null : Number(v));
    let list = all.filter((o) =>
      (!cat || o.category === cat) &&
      (min === null || o.price >= min) && (max === null || o.price < max) &&
      (!q || norm(o.title).includes(q)));
    const by = {
      discount: (a, b) => b.discountPercent - a.discountPercent,
      price: (a, b) => a.price - b.price,
      sales: (a, b) => (b.salesCount || 0) - (a.salesCount || 0),
      rating: (a, b) => (b.rating || 0) - (a.rating || 0) || (b.salesCount || 0) - (a.salesCount || 0),
    };
    return list.sort(by[$("sort").value]);
  }
  function card(o) {
    const a = document.createElement("a");
    a.className = "card"; a.href = o.url; a.target = "_blank"; a.rel = "noopener sponsored";
    const proof = [o.rating ? `<span class="star">★</span>${o.rating.toFixed(1).replace(".", ",")}` : "", o.salesCount ? `${fmtSales(o.salesCount)} vendidos` : ""].filter(Boolean).join(" · ");
    a.innerHTML =
      `<span class="badge">-${Math.round(o.discountPercent)}%</span>` + (o.official && !o.hot ? `<span class="mall">Loja oficial</span>` : "") +
      `<img loading="lazy" src="${o.imageUrl || ""}" alt="">` +
      `<div class="body"><div class="cat"></div><div class="title"></div><div class="proof">${proof}</div>` +
      `<div class="old">${o.originalPrice ? "de " + brl.format(o.originalPrice) : ""}</div>` +
      `<div class="price">${o.hasVariantPrices ? "<small>a partir de</small> " : ""}${brl.format(o.price)}</div>` +
      `<div class="btn">Ver na Shopee</div></div>`;
    a.querySelector(".cat").textContent = o.category || "";
    a.querySelector(".title").textContent = o.title;
    return a;
  }
  function renderHot() {
    const q = $("q").value.trim();
    const hot = all.filter((o) => o.hot);
    const show = hot.length > 0 && !q && !cat && $("price").value === "0-";
    $("hot").hidden = !show;
    if (!show) return;
    const row = $("hotrow"); row.innerHTML = "";
    hot.forEach((o) => { const c = card(o); c.insertAdjacentHTML("beforeend", '<span class="fire">🔥</span>'); row.appendChild(c); });
  }
  function render(scroll) {
    renderHot();
    const list = filtered();
    const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
    page = Math.min(Math.max(1, page), pages);
    const grid = $("grid"); grid.classList.remove("skeleton"); grid.innerHTML = "";
    list.slice((page - 1) * PER_PAGE, page * PER_PAGE).forEach((o) => grid.appendChild(card(o)));
    $("empty").hidden = list.length > 0;
    $("count").textContent = list.length ? `${list.length} oferta${list.length > 1 ? "s" : ""}` + (pages > 1 ? ` · página ${page} de ${pages}` : "") : "";
    const pager = $("pager"); pager.innerHTML = "";
    if (pages > 1) {
      const btn = (label, target, on, dis) => { const b = document.createElement("button"); b.textContent = label; b.disabled = !!dis; if (on) b.className = "on"; b.onclick = () => { page = target; render(true); }; pager.appendChild(b); };
      btn("‹", page - 1, false, page === 1);
      const span = [...new Set([1, 2, page - 1, page, page + 1, pages - 1, pages].filter((p) => p >= 1 && p <= pages))].sort((a, b) => a - b);
      let last = 0;
      for (const p of span) { if (p - last > 1) { const s = document.createElement("span"); s.textContent = "…"; pager.appendChild(s); } btn(String(p), p, p === page); last = p; }
      btn("›", page + 1, false, page === pages);
    }
    if (scroll) window.scrollTo({ top: 0 });
  }
  function buildChips() {
    const counts = {};
    all.forEach((o) => { if (o.category) counts[o.category] = (counts[o.category] || 0) + 1; });
    const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    const chips = $("chips"); chips.innerHTML = "";
    [["", "Todas"], ...names.map((n) => [n, n])].forEach(([value, label]) => {
      const b = document.createElement("button"); b.className = "chip" + (value === cat ? " on" : "");
      b.textContent = value ? `${label} (${counts[value]})` : label;
      b.onclick = () => { cat = value; page = 1; [...chips.children].forEach((c) => c.classList.toggle("on", c === b)); render(); };
      chips.appendChild(b);
    });
  }
  ["q", "price", "sort"].forEach((id) => $(id).addEventListener(id === "q" ? "input" : "change", () => { page = 1; render(); }));

  fetch("data/offers.json?t=" + Math.floor(Date.now() / 60000))
    .then((r) => r.json())
    .then((data) => {
      all = data.offers || [];
      if (data.updatedAt) {
        const d = new Date(data.updatedAt);
        $("updated").textContent = "Atualizado " + d.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
      }
      buildChips();
      render();
    })
    .catch(() => { $("grid").classList.remove("skeleton"); $("grid").innerHTML = ""; $("empty").hidden = false; });
</script>
</body>
</html>
