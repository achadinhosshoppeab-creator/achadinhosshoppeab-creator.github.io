  @media (prefers-color-scheme: dark) { :root { --bg: #161210; --card: #221b18; --text: #f3ece8; --muted: #b3a79f; --line: #3a2d27; } }
  * { box-sizing: border-box; }

  .link { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-decoration: none; color: inherit; font-weight: 700; font-size: 16px; }
  .link:active { transform: scale(.98); }
  .link.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .link .ico { font-size: 22px; width: 28px; text-align: center; }
  .link .sub { display: block; font-weight: 500; font-size: 12px; opacity: .8; }
  .link span.txt { text-align: left; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
